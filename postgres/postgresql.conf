listen_addresses = '*'
# Raised from 100 to 200 to accommodate PgBouncer's pool (default_pool_size=25
# + reserve=5 per database) plus direct admin/migration connections. PgBouncer
# transaction-pooling multiplexes many client connections onto fewer server
# connections, so 200 is ample even under heavy load.
max_connections = 200                   # (change requires restart)
shared_buffers = 128MB                  # min 128kB
dynamic_shared_memory_type = posix      # the default is usually the first option
max_wal_size = 1GB
min_wal_size = 80MB
log_timezone = 'Etc/UTC'
datestyle = 'iso, mdy'
timezone = 'Etc/UTC'
lc_messages = 'en_US.utf8'                      # locale for system error message
lc_monetary = 'en_US.utf8'                      # locale for monetary formatting
lc_numeric = 'en_US.utf8'                       # locale for number formatting
lc_time = 'en_US.utf8'                          # locale for time formatting
default_text_search_config = 'pg_catalog.english'

archive_mode = on
archive_command = 'pgbackrest --stanza=mediajira_db archive-push %p'



