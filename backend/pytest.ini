[pytest]
python_files = tests.py test_*.py tests_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=budget_approval
    --cov=retrospective
    --cov=campaign
    --cov=client_communication
    --cov=meetings
    --cov-report=html:htmlcov
    --cov-report=json:coverage.json
    --cov-report=term-missing
    --cov-fail-under=85
    --durations=10
    --maxfail=5
    --disable-warnings
    --ds=backend.settings
    --ignore=metric_upload/tests/integration
    --ignore=asset/tests/test_tasks.py
    --ignore=budget_approval/tests/test_concurrency.py
    -n auto
    --dist loadscope
    --timeout=600
    --reruns 2
    --reruns-delay 1
markers =
    unit: Unit tests
    integration: Integration tests
    concurrency: Concurrency tests
    escalation: Escalation tests
    permissions: Permission tests
    slow: Slow running tests
    api: API tests
    models: Model tests
    services: Service tests
    views: View tests
    asyncio: Async tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
# ⚠️ DO NOT add a `testpaths` block here. It is intentionally absent so a bare
# `pytest` collects the FULL suite (restores SMP-555). A `testpaths` narrowing was
# re-introduced by accident via PR #727 (675ac68de + the b11556033 merge), which
# silently cut CI from ~4,457 to ~1,123 tests and hid genuinely-broken agent tests.
# If you only want to run a subset locally, pass paths on the CLI (`pytest csm/tests`)
# — do NOT re-add `testpaths`, or CI stops running most of the suite for everyone.
asyncio_mode = auto
